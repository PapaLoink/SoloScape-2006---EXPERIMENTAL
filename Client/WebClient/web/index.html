<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>06 Client</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="screen">
    <canvas id="game" width="765" height="503" aria-label="06 Java client"></canvas>
    <div id="status">Connecting to Java client…</div>
    <button id="sound" type="button" aria-label="Enable browser audio">Enable sound</button>
    <button id="keyboard" type="button" aria-label="Open keyboard">⌨</button>
    <input id="softInput" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Game keyboard input">
  </main>
  <script>
    var clientScript = document.createElement('script');
    clientScript.src = document.documentMode ? '/windows-client.js' : '/app.js';
    document.body.appendChild(clientScript);
  </script>
</body>
</html>

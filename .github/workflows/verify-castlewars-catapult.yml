name: Verify Castle Wars Catapult 443
on:
  pull_request:
    paths:
      - 'Server/src/main/java/com/rs2/model/gameplay/castlewars/CastleWarsEngineeringManager.java'
      - 'Server/src/main/java/com/rs2/net/packet/InterfaceBridge.java'
      - 'Server/src/main/java/com/rs2/net/packet/PacketSender.java'
      - 'Server/src/main/java/com/rs2/model/player/Player.java'
      - 'Server/src/main/java/com/rs2/model/gameplay/castlewars/CastleWarsManager.java'
      - 'Server/src/test/java/CastleWarsHudPositionChecks.java'
      - 'Server/src/test/java/CastleWarsNativePanels443Checks.java'
      - 'Server/src/main/java/com/rs2/net/packet/handler/ButtonClickPacketHandler.java'
      - 'Server/src/main/java/com/rs2/net/packet/handler/InterfaceActionPacketHandler.java'
      - 'Server/src/test/java/CastleWarsCatapult443Checks.java'
      - 'Server/src/test/java/CastleWarsCatapultWidgetCacheChecks.java'
      - '.github/workflows/verify-castlewars-catapult.yml'
  push:
    branches:
      - Audit/Castlewars
    paths:
      - 'Server/src/main/java/com/rs2/model/gameplay/castlewars/CastleWarsEngineeringManager.java'
      - 'Server/src/main/java/com/rs2/net/packet/InterfaceBridge.java'
      - 'Server/src/main/java/com/rs2/net/packet/PacketSender.java'
      - 'Server/src/main/java/com/rs2/model/player/Player.java'
      - 'Server/src/main/java/com/rs2/model/gameplay/castlewars/CastleWarsManager.java'
      - 'Server/src/test/java/CastleWarsHudPositionChecks.java'
      - 'Server/src/test/java/CastleWarsNativePanels443Checks.java'
      - 'Server/src/main/java/com/rs2/net/packet/handler/ButtonClickPacketHandler.java'
      - 'Server/src/main/java/com/rs2/net/packet/handler/InterfaceActionPacketHandler.java'
      - 'Server/src/test/java/CastleWarsCatapult443Checks.java'
      - 'Server/src/test/java/CastleWarsCatapultWidgetCacheChecks.java'
      - '.github/workflows/verify-castlewars-catapult.yml'
  workflow_dispatch:
jobs:
  catapult:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Inspect native catapult widget group 54
        working-directory: Server
        run: |
          mkdir -p catapult-test-classes
          javac -cp 'lib/*' -d catapult-test-classes \
            src/main/java/com/rs2/cache/js5/ConfigReader.java \
            src/main/java/com/rs2/cache/js5/Js5CacheStore.java \
            src/main/java/com/rs2/cache/js5/Js5Container.java \
            src/main/java/com/rs2/cache/js5/Js5Group.java \
            src/main/java/com/rs2/cache/js5/Js5ReferenceTable.java \
            src/main/java/com/rs2/cache/js5/Interfaces.java \
            src/test/java/CastleWarsCatapultWidgetCacheChecks.java
          java -cp 'catapult-test-classes:lib/*' CastleWarsCatapultWidgetCacheChecks
      - name: Compile server and verify native catapult actions
        working-directory: Server
        run: |
          mkdir -p catapult-server-classes
          find src/main/java -name '*.java' > /tmp/catapult-server-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d catapult-server-classes @/tmp/catapult-server-sources.txt
          javac -encoding UTF-8 -cp 'catapult-server-classes:lib/*' -d catapult-server-classes src/test/java/CastleWarsCatapult443Checks.java
          java -cp 'catapult-server-classes:lib/*' CastleWarsCatapult443Checks
          javac -encoding UTF-8 -cp 'catapult-server-classes:lib/*' -d catapult-server-classes src/test/java/CastleWarsHudPositionChecks.java
          java -cp 'catapult-server-classes:lib/*' CastleWarsHudPositionChecks
          javac -encoding UTF-8 -cp 'catapult-server-classes:lib/*' -d catapult-server-classes src/test/java/CastleWarsNativePanels443Checks.java
          java -cp 'catapult-server-classes:lib/*' CastleWarsNativePanels443Checks

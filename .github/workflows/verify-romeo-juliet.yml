name: Verify Romeo and Juliet Dialogue

on:
  pull_request:
    paths:
      - 'Server/src/main/java/com/rs2/model/quest/impl/RomeoAndJulietQuest.java'
      - 'Server/src/main/java/com/rs2/model/quest/impl/RomeoJulietCutscenes.java'
      - 'Server/src/main/java/com/rs2/model/quest/impl/RomeoJulietSupportingNpcs.java'
      - 'Server/src/main/java/com/rs2/model/quest/impl/CadavaPotionDrinkRecoveryTask.java'
      - 'Server/src/main/java/com/rs2/Server.java'
      - 'Server/src/test/java/RomeoAndJulietDialogueChecks.java'
      - 'Server/src/test/java/NpcDialogueAudit.java'
      - '.github/workflows/verify-romeo-juliet.yml'
  workflow_dispatch:

jobs:
  romeo-juliet-dialogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile server and verify quest dialogues
        working-directory: Server
        run: |
          mkdir -p romeo-juliet-test-classes
          find src/main/java -name '*.java' > /tmp/romeo-juliet-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d romeo-juliet-test-classes @/tmp/romeo-juliet-sources.txt
          javac -encoding UTF-8 -cp 'romeo-juliet-test-classes:lib/*' -d romeo-juliet-test-classes \
            src/test/java/NpcDialogueAudit.java \
            src/test/java/RomeoAndJulietDialogueChecks.java
          java -cp 'romeo-juliet-test-classes:lib/*' RomeoAndJulietDialogueChecks

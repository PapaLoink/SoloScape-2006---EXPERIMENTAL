name: Verify Castle Wars lobby entrance doors
on:
  push:
    branches:
      - fix/castle-wars-lobby-door-open-once
  pull_request:
    paths:
      - 'Server/src/main/java/com/rs2/model/objects/functions/DoubleDoorHandler.java'
      - 'Server/src/main/java/com/rs2/model/interaction/FirstObjectActionTask.java'
      - 'Server/src/test/java/com/rs2/model/objects/functions/CastleWarsLobbyEntranceChecks.java'
      - '.github/workflows/verify-castlewars-lobby-door.yml'
  workflow_dispatch:
jobs:
  lobby-door:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile server and verify Castle Wars lobby entrance
        working-directory: Server
        run: |
          mkdir -p castle-wars-lobby-test-classes
          find src/main/java -name '*.java' > /tmp/castle-wars-lobby-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d castle-wars-lobby-test-classes @/tmp/castle-wars-lobby-sources.txt
          javac -encoding UTF-8 -cp 'castle-wars-lobby-test-classes:lib/*' -d castle-wars-lobby-test-classes src/test/java/com/rs2/model/objects/functions/CastleWarsLobbyEntranceChecks.java
          java -cp 'castle-wars-lobby-test-classes:lib/*' com.rs2.model.objects.functions.CastleWarsLobbyEntranceChecks

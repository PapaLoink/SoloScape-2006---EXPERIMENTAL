name: Verify Idle Logout Configuration
on:
  push:
    branches:
      - fix/webclient-mobile-cleanup
    paths:
      - 'Server/src/main/java/com/rs2/Server.java'
      - 'Server/src/main/java/com/rs2/ConfigFile.java'
      - 'Server/src/main/java/com/rs2/model/player/Player.java'
      - 'Server/src/test/java/IdleLogoutConfigChecks.java'
      - '.github/workflows/verify-idle-logout.yml'
  pull_request:
    paths:
      - 'Server/src/main/java/com/rs2/Server.java'
      - 'Server/src/main/java/com/rs2/ConfigFile.java'
      - 'Server/src/test/java/IdleLogoutConfigChecks.java'
  workflow_dispatch:
jobs:
  idle-logout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile server and verify idle logout config
        working-directory: Server
        run: |
          mkdir -p build-idle-logout-checks
          find src/main/java -name '*.java' > /tmp/soloscape-idle-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d build-idle-logout-checks @/tmp/soloscape-idle-sources.txt
          javac -encoding UTF-8 -cp 'build-idle-logout-checks:lib/*' -d build-idle-logout-checks src/test/java/IdleLogoutConfigChecks.java
          java -cp 'build-idle-logout-checks:lib/*' IdleLogoutConfigChecks

name: Verify Removed Content
on:
  push:
    branches: [main]
    paths:
      - 'Server/src/**'
      - 'Client/src/**'
      - 'Client/tests/RemovedContentChecks.java'
      - '.github/workflows/verify-removed-content.yml'
  pull_request:
    paths:
      - 'Server/src/**'
      - 'Client/src/**'
      - 'Client/tests/RemovedContentChecks.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  removed-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile client and server and verify removed features
        working-directory: Server
        run: |
          mkdir -p /tmp/removed-content-classes
          find src/main/java ../Client/src -name '*.java' > /tmp/removed-content-sources.txt
          javac -encoding UTF-8 -cp 'lib/*' -d /tmp/removed-content-classes @/tmp/removed-content-sources.txt
          javac -encoding UTF-8 -cp '/tmp/removed-content-classes:lib/*' -d /tmp/removed-content-classes ../Client/tests/RemovedContentChecks.java src/test/java/ControlPanelConfigChecks.java
          java -Djava.awt.headless=true -cp '/tmp/removed-content-classes:lib/*:../Client/src' unpackaged.RemovedContentChecks
          classes=/tmp/removed-content-classes
          libraries="$PWD/lib/*"
          sandbox=$(mktemp -d)
          cd "$sandbox"
          java -Djava.awt.headless=true -cp "$classes:$libraries" ControlPanelConfigChecks
